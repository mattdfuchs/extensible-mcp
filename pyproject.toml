[project]
name = "extensible-mcp"
version = "0.1.0"
description = "MCP proxy that replaces tool definitions with semantic search"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "mcp>=1.0.0",
    "fastembed>=0.6.0",
    "numpy>=1.24.0",
    "regopy>=0.4.0",
]

[project.scripts]
extensible-mcp = "extensible_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/extensible_mcp"]

[tool.hatch.build.targets.wheel]
packages = ["src/extensible_mcp"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
