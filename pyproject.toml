[project]
name = "extensible-mcp"
version = "0.3.3"
description = "MCP proxy that replaces tool definitions with semantic search"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Fuchs" }]
dependencies = [
    "fastmcp>=2.0.0",
    "mcp>=1.0.0",
    "fastembed>=0.6.0",
    "numpy>=1.24.0",
    # Imported at module scope by client_manager for URL-transport downstreams
    # and token headers. Arrives transitively via mcp/fastmcp today, but a
    # core module importing it directly must declare it.
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/mattdfuchs/extensible-mcp"
Changelog = "https://github.com/mattdfuchs/extensible-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/mattdfuchs/extensible-mcp/issues"
Security = "https://github.com/mattdfuchs/extensible-mcp/security/policy"

[project.scripts]
extensible-mcp = "extensible_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/extensible_mcp",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extensible_mcp"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
# WASM policy engine: evaluate OPA-compiled policies in-process, with crypto
# builtins (io.jwt.verify_*, crypto.sha256) supplied from Python. joserfc
# matches the JOSE choices of the identity layer for credential interop.
# jsonschema validates assembled inputs against a bundle's manifest.
wasm = [
    "wasmtime>=24.0",
    "joserfc>=1.6.5",
    "jsonschema>=4.18",
    # verify_ed25519_raw's host builtin imports this lazily; it arrives via
    # joserfc today, but the dependency is real and belongs stated.
    "cryptography>=42.0",
]
# RegoPolicyFilter's interpreter. Optional: regopy ships no wheels for some
# platforms (e.g. linux/arm64) and its sdist build needs git + a C++
# toolchain; the filter lazy-imports it and errors helpfully when absent.
rego = [
    "regopy>=0.4.0",
]
# CEL policy engine: a second PolicyEngine implementation (see bundle.py /
# cel_policy.py), proving the bundle format is engine-plural rather than
# tied to one supplier's toolchain. Pure Python, no compiled sandbox.
cel = [
    "cel-python>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    # The three engine extras, rather than a copy of their contents that
    # drifts the moment either side changes.
    "extensible-mcp[wasm,rego,cel]",
]

[tool.uv.workspace]
members = ["examples/agentic-commerce-demo", "examples/identity"]

# The dev group depends on this package's own extras; without this uv would
# look for extensible-mcp on an index instead of using the checkout.
[tool.uv.sources]
extensible-mcp = { workspace = true }
