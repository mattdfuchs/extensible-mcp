name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Contributions carry a Developer Certificate of Origin sign-off. Only on
  # pull requests: the DCO is a statement by a *contributor* about code they
  # are submitting, and the maintainer pushing to their own repo is not making
  # that statement to anyone.
  #
  # Merge commits are skipped. They author no content of their own -- every
  # non-merge commit in the range is still checked individually -- and the
  # branch protection is `strict`, so GitHub's own "Update branch" button
  # creates a merge commit nobody can sign off and no contributor authored.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        run: |
          missing=0
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$sha")"
              echo "  missing: Signed-off-by: $author"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo ""
            echo "Add sign-offs with:  git commit -s   (or, to fix existing commits)"
            echo "  git rebase --signoff ${{ github.event.pull_request.base.sha }}"
            echo "See CONTRIBUTING.md for what signing off certifies."
            exit 1
          fi
          echo "All commits signed off."

  # `main` is the published history: it is pushed to the public repository at
  # release. NOTES.md and anything else from the `response` branch are private
  # working notes, and a merge or cherry-pick that brings them across is the one
  # slip that cannot be withdrawn. Add a path to the list to cover it too.
  no-private-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: main carries no private working notes
        run: |
          status=0
          for path in NOTES.md; do
            if [ -e "$path" ]; then
              echo "::error file=$path::private working notes must never reach main"
              status=1
            fi
          done
          if [ "$status" = 0 ]; then echo "No private working notes in the tree."; fi
          exit $status

  # GitHub's own secret scanning and push protection need Advanced Security,
  # which a private repository does not get -- and privacy only defers the
  # hazard anyway, since release is a push of this `main` to the public
  # repository. So the scan runs here, and it is a gate: gitleaks exits 1 when
  # it reports a finding, this step swallows no exit status and sets no
  # `continue-on-error`, so a finding fails the job rather than annotating it.
  # The allowlist lives in .gitleaks.toml, one entry per string that only
  # looks like a credential, with the reason it cannot be one beside it.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so a pull request is scanned over its full diff
          # range rather than at its tip: a secret added in one commit of the
          # branch and deleted in the next is still in the history that gets
          # published.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          # Pinned, and the download is checksummed: a scanner fetched over
          # the network is on the trust path of every later commit.
          VERSION: 8.28.0
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: No secrets in the history under review
        run: |
          set -euo pipefail
          scan=(gitleaks git . --no-banner --redact --config .gitleaks.toml)
          if [ "${{ github.event_name }}" = pull_request ]; then
            # Every commit this pull request would add to main.
            scan+=(--log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          else
            # A push to main is the last gate before the public repository, so
            # scan everything reachable from it -- not the other refs that
            # fetch-depth 0 brings along, which are not what gets published.
            scan+=(--log-opts HEAD)
          fi
          "${scan[@]}"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # --all-packages, or the two workspace members are never installed and
        # their suites cannot run.
        run: uv sync --all-packages --group dev
      - name: Run core tests
        run: uv run pytest -q
      - name: Run commerce demo tests
        run: uv run --package extensible-mcp-vc pytest examples/agentic-commerce-demo/tests -q
      - name: Run identity tests
        run: uv run --package household-identity pytest examples/identity/tests -q
