[project]
name = "household-identity"
version = "0.0.1"
description = "Wallet and DID server for the extensible-mcp family-network demo"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Matthew Fuchs" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=42.0",
    "httpx>=0.27",
    "multiformats>=0.3",
    "pydantic>=2.7",
    "joserfc>=1.6.5",
]

[project.scripts]
wallet = "household_identity.wallet.cli:main"
did-server = "household_identity.did_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/household_identity"]

[tool.hatch.build.targets.wheel]
packages = ["src/household_identity"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
